# -*- mode: sh; sh-shell: bash; indent-tabs-mode: nil; tab-width: 2 -*-
# vim: ft=bash:et:ts=2:sts=2:sw=2
# code: language=bash insertSpaces=true tabSize=2
# shellcheck shell=bash disable=SC2148
#
# Dotfiles linking configuration: repo source → home target pairs.

# Flat file syncing: repo_dir:home_dir pairs
# Files in repo_dir are symlinked to home_dir (no subdirectory nesting).
# Stale links pointing to deleted repo files are automatically cleaned up.
# External/custom symlinks in home_dir are preserved.
# shellcheck disable=SC2034 # SYNC_DIRS is used in link.sh
declare -A SYNC_DIRS=(
  ["${REPO_ROOT}/bin"]="$HOME/bin"
  ["${REPO_ROOT}/lib"]="$HOME/lib"
)

# Directories under home/ linked as a whole (one directory symlink instead
# of one symlink per file). Opt-in, paths relative to home/. For apps that
# save atomically (write temp file + rename), which replaces a per-file symlink
# with a regular file. Everything the app writes into the directory lands in
# the repo, so add .gitignore entries for anything that should not be tracked.
# shellcheck disable=SC2034 # LINK_DIRS is used in link.sh
LINK_DIRS=(
  ".config/vicinae"
  # foot-theme install/uninstall add and delete files here; with one
  # directory link they land in the repo, no dotfiles-link run needed.
  ".config/foot/themes"
)

# Symlinks from one $HOME path to another, not into the repo: link → target,
# both relative to $HOME. For apps that prefer a legacy location over the XDG
# one the repo deploys to. An existing file or directory at the link path is
# moved to the backup directory first.
# shellcheck disable=SC2034 # HOME_LINKS is used in link.sh
declare -A HOME_LINKS=(
  # Emacs reads ~/.emacs.d/ instead of ~/.config/emacs/ whenever it exists,
  # and creates it when run before ~/.config/emacs/ exists (any build).
  [".emacs.d"]=".config/emacs"
)

# Stale-link pruning (see docs/linking-system.md): besides every directory
# mirrored from home/, $HOME is scanned this deep (find -maxdepth, -xdev) for
# repo symlinks left in directories that no longer exist in the repo.
# shellcheck disable=SC2034 # PRUNE_SCAN_DEPTH is used in link.sh
PRUNE_SCAN_DEPTH="${PRUNE_SCAN_DEPTH:-3}"
