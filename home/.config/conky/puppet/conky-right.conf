-- puppet (notebook): journal + sway session log, right two thirds of the
-- screen (x 630..1910 of the 1920x1080 logical output); conky-left.conf holds
-- the stats. FOLD_WIDTH 155 ~ 1280 px at font4 (FiraCode 8pt, ~8 px/char).
conky.config = {
    alignment = 'top_left',
    background = false,
    border_width = 0,
    color1 = '#FFFFFF',
    color2 = '#6a7d93',
    color3 = '#0077FF',
    color4 = '#FFD000',
    default_color = '#FFFFFF',
    default_outline_color = '#000000',
    default_shade_color = '#6a7d93',
    double_buffer = true,
    draw_borders = false,
    draw_outline = false,
    draw_shades = false,
    gap_x = 630,
    gap_y = 10,
    border_outer_margin = 0,
    maximum_width = 1280,
    minimum_width = 1280,
    max_user_text = 16384,
    minimum_height = 1030,
    no_buffers = true,
    out_to_console = false,
    out_to_x = false,
    out_to_wayland = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'dock',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar',
    own_window_transparent = true,
    own_window_argb_value = 200,
    own_window_colour = 'black',
    own_window_argb_visual = true,
    update_interval = 5,
    uppercase = false,
    use_xft = true,
    xftalpha = 0.8,
    font = 'FiraCode Nerd Font:size=9:regular',
    font3 = 'FiraCode Nerd Font:bold:size=10',
    font4 = 'FiraCode Nerd Font:size=8:regular'
};

conky.text = [[
${color3}${font3}SYSTEM LOG${font}${color}
${color1}${font4}${execp $HOME/.local/conky/bin/conky-syslogs 155 45 8 "$HOME/.local/state/sway/session.log"}${font}${color}
]];
