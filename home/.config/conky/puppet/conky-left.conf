-- puppet (notebook): system stats, left third of the screen.
-- Sized for eDP-1 at 3840x2160, scale 2 (1920x1080 logical); the log panel
-- (conky-right.conf) takes the remaining two thirds.
conky.config = {
    alignment = 'top_left',
    background = false,
    border_width = 0,
    color1 = '#FFFFFF',
    color2 = '#6a7d93',
    color3 = '#0077FF',
    color4 = '#FFD000',
    default_color = '#FFFFFF',
    default_outline_color = '#000000',
    default_shade_color = '#6a7d93',
    cpu_avg_samples = 1,
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    gap_x = 10,
    gap_y = 10,
    border_outer_margin = 0,
    maximum_width = 600,
    minimum_width = 600,
    max_user_text = 16384,
    minimum_height = 480,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_x = false,
    out_to_wayland = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'dock',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar',
    own_window_transparent = true,
    own_window_argb_value = 200,
    own_window_colour = 'black',
    own_window_argb_visual = true,
    update_interval = 5,
    top_cpu_separate = true,
    top_name_width = 15,
    uppercase = false,
    use_xft = true,
    xftalpha = 0.8,
    font = 'FiraCode Nerd Font:size=9:regular',
    font1 = 'FiraCode Nerd Font:size=9:bold',
    font3 = 'FiraCode Nerd Font:bold:size=10',
    -- Shared threshold helpers (single copy, lives in the motoko set).
    lua_load = os.getenv('HOME') .. '/.config/conky/motoko/conky-colors.lua'
};

-- Devices are addressed by name (hwmon coretemp, BAT1, wlp0s20f3), not index.
conky.text = [[
${color3}${font3}SYSTEM STATUS${font}${color}

${color1}${font1}Hostname:${font} ${color}$nodename ${alignr}${color1}Kernel: ${color}$kernel
${color1}${font1}Uptime:${font} ${color}$uptime ${alignr}${color1}Load: ${lua_parse conky_color_loadavg 6 8 green}${loadavg 1}${color} ${loadavg 2} ${loadavg 3}
${color1}${font1}Battery:${font} ${lua_parse conky_color_battery BAT1 20 10 green}${battery_percent BAT1}%${color} ${color2}${battery_status BAT1}${color} ${alignr}${battery_time BAT1}
${color2}${hr 2}${color}
${color3}${font3}CPU: ${color4}${execi 3600 grep -m1 "model name" /proc/cpuinfo | sed 's/.*: //;s/([RT]M)//g;s/ CPU//;s/ @.*//;s/  */ /g'}${font}${color}

${color1}${font1}Thread \#1:${font} ${lua_parse conky_color_cpu_core 1 80 95}${freq_g 1}${color1} GHz ${alignr}${cpubar cpu1 6,400}
${color1}${font1}Thread \#2:${font} ${lua_parse conky_color_cpu_core 2 80 95}${freq_g 2}${color1} GHz ${alignr}${cpubar cpu2 6,400}
${color1}${font1}Thread \#3:${font} ${lua_parse conky_color_cpu_core 3 80 95}${freq_g 3}${color1} GHz ${alignr}${cpubar cpu3 6,400}
${color1}${font1}Thread \#4:${font} ${lua_parse conky_color_cpu_core 4 80 95}${freq_g 4}${color1} GHz ${alignr}${cpubar cpu4 6,400}
${color1}${font1}Thread \#5:${font} ${lua_parse conky_color_cpu_core 5 80 95}${freq_g 5}${color1} GHz ${alignr}${cpubar cpu5 6,400}
${color1}${font1}Thread \#6:${font} ${lua_parse conky_color_cpu_core 6 80 95}${freq_g 6}${color1} GHz ${alignr}${cpubar cpu6 6,400}
${color1}${font1}Thread \#7:${font} ${lua_parse conky_color_cpu_core 7 80 95}${freq_g 7}${color1} GHz ${alignr}${cpubar cpu7 6,400}
${color1}${font1}Thread \#8:${font} ${lua_parse conky_color_cpu_core 8 80 95}${freq_g 8}${color1} GHz ${alignr}${cpubar cpu8 6,400}
${color1}${font1}Load:${font}    ${lua_parse conky_color_cpu 80 95 green}${cpu}${color1}% ${alignr}${font1}Package:${font} ${lua_parse conky_color_hwmon coretemp temp 1 85 95 green}${hwmon coretemp temp 1}${color1}°C${color}
${lua_parse conky_color_cpu 80 95 FFFFFF}${cpugraph cpu0 40,600 07CC0D FF0000 -t}${color}
${color2}${hr 2}${color}
${color3}${font3}MEMORY${font}${color}

${color1}${font1}RAM:${font} ${alignr}${color}$mem / $memmax [${lua_parse conky_color_memperc 80 90 green}$memperc%${color}]
${lua_parse conky_color_memperc 80 90 FFFFFF}${memgraph 40,600 07CC0D FF0000 -t}${color}
${color1}${font1}SWAP:${font} ${alignr}${color}$swap / $swapmax [${lua_parse conky_color_swapperc 50 80 green}$swapperc%${color}]
${color2}${hr 2}${color}
${color3}${font3}STORAGE${font}${color}

${color1}${font1}/:${font} ${alignr}${color}${fs_used /} / ${fs_size /} [${lua_parse conky_color_disk / 80 95 green}${fs_used_perc /}%${color}]
${color1}${font1}NVMe:${font} ${lua_parse conky_color_hwmon nvme temp 1 70 80 green}${hwmon nvme temp 1}${color1}°C ${alignr}${color1}R: ${color}${diskio_read /dev/nvme0n1}  ${color1}W: ${color}${diskio_write /dev/nvme0n1}
${color2}${hr 2}${color}
${color3}${font3}NETWORK${font}${color}

${color1}${font1}WiFi:${font} ${color}wlp0s20f3 ${alignr}${color1}Signal: ${color}${wireless_link_qual_perc wlp0s20f3}%  ${color1}IP: ${color}${addr wlp0s20f3}
${color1}${font1}Down:${font} ${color}${downspeed wlp0s20f3} ${alignr}${color1}Up: ${color}${upspeed wlp0s20f3}
${downspeedgraph wlp0s20f3 30,295 0077FF 07CC0D -t} ${alignr}${upspeedgraph wlp0s20f3 30,295 0077FF 07CC0D -t}
${color2}${hr 2}${color}
${color3}${font3}TOP PROCESSES by CPU${font}${color}

${color1}${font1}Name                 PID   CPU%  MEM% ${alignr}TIME${font}${color}
${color}${top name 1} ${top pid 1} ${top cpu 1} ${top mem 1}${alignr}${top time 1}
${color}${top name 2} ${top pid 2} ${top cpu 2} ${top mem 2}${alignr}${top time 2}
${color}${top name 3} ${top pid 3} ${top cpu 3} ${top mem 3}${alignr}${top time 3}
${color}${top name 4} ${top pid 4} ${top cpu 4} ${top mem 4}${alignr}${top time 4}
${color}${top name 5} ${top pid 5} ${top cpu 5} ${top mem 5}${alignr}${top time 5}
${color2}${hr 2}${color}
${color3}${font3}TOP PROCESSES by MEMORY${font}${color}

${color1}${font1}Name                 PID   CPU%  MEM% ${alignr}RES${font}${color}
${color}${top_mem name 1} ${top_mem pid 1} ${top_mem cpu 1} ${top_mem mem 1}${alignr}${top_mem mem_res 1}
${color}${top_mem name 2} ${top_mem pid 2} ${top_mem cpu 2} ${top_mem mem 2}${alignr}${top_mem mem_res 2}
${color}${top_mem name 3} ${top_mem pid 3} ${top_mem cpu 3} ${top_mem mem 3}${alignr}${top_mem mem_res 3}
${color}${top_mem name 4} ${top_mem pid 4} ${top_mem cpu 4} ${top_mem mem 4}${alignr}${top_mem mem_res 4}
${color}${top_mem name 5} ${top_mem pid 5} ${top_mem cpu 5} ${top_mem mem 5}${alignr}${top_mem mem_res 5}
]];
