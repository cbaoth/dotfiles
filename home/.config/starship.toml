"$schema" = 'https://starship.rs/config-schema.json'
# ~/.config/starship.toml — starship prompt configuration
# Base: the tokyo-night preset (`starship preset tokyo-night`), to be evolved
# step by step. Deviations from the preset are marked with "local:".
# Reference: https://starship.rs/config/
#
# Try another preset without touching this file (it is a symlink into
# dotfiles): `starship-preset-test <name>` (~/.zsh.d/aliases.zsh).

# local: $username and the remote host added to the first segment — the preset
# shows neither, not even over ssh or as root. The segment colour is the
# palette colour `head`: blue-grey locally, amber in a remote session.
#
# Remote/root state comes from ~/.zshrc (PROMPT section), not from starship's
# own ssh detection, which sudo/su defeat by stripping the SSH_* variables:
#   CB_PROMPT_REMOTE  short hostname (uppercase), set only in a remote session
#   CB_PROMPT_ROOT    set only when EUID is 0
# For remote and/or root ~/.zshrc points STARSHIP_CONFIG at a generated copy
# of this file (sed: swaps whatever `palette = "..."` says to `palette =
# "remote"`; root drops the `$character"""` line, keep it on a line of its
# own); edit only this file.
#
# local: colour theme — every colour below is a named role (head/accent/
# tier3/tier4/tier5/text_dark/muted/error/bright) resolved through whichever
# palette is active here, so switching themes never touches the layout.
# Options: "local" (current, tokyo-night-derived), "eldritch_cthulhu",
# "eldritch_abyss" — best-effort colour ports of
# https://github.com/eldritch-theme/starship, fine-tune the palette tables
# below if needed. "remote" is reserved for the ssh/root variant above.
palette = "eldritch_cthulhu"

# local: directory scan budget for module detection (default 30 ms). Hit in
# ~ on a busy disk and on NFS mounts, where each readdir is a network trip;
# a timeout drops modules and prints a warning; 100 ms only costs there.
scan_timeout = 100

format = """
[░▒▓](fg:head)\
$os\
$username\
${env_var.CB_PROMPT_REMOTE}\
[](bg:accent fg:head)\
$directory\
[](fg:accent bg:tier3)\
$git_branch\
$git_status\
[](fg:tier3 bg:tier4)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:tier4 bg:tier5)\
$time\
[ ](fg:tier5)\
\n${env_var.CB_PROMPT_ROOT}\
$character"""

[directory]
style = "fg:text_dark bg:accent"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:tier3"
format = '[[ $symbol $branch ](fg:accent bg:tier3)]($style)'

[git_status]
style = "bg:tier3"
format = '[[($all_status$ahead_behind )](fg:accent bg:tier3)]($style)'

[nodejs]
symbol = ""
style = "bg:tier4"
format = '[[ $symbol ($version) ](fg:accent bg:tier4)]($style)'

[bun]
symbol = ""
style = "bg:tier4"
format = '[[ $symbol ($version) ](fg:accent bg:tier4)]($style)'

[rust]
symbol = ""
style = "bg:tier4"
format = '[[ $symbol ($version) ](fg:accent bg:tier4)]($style)'

[golang]
symbol = ""
style = "bg:tier4"
format = '[[ $symbol ($version) ](fg:accent bg:tier4)]($style)'

[php]
symbol = ""
style = "bg:tier4"
format = '[[ $symbol ($version) ](fg:accent bg:tier4)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:tier5"
format = '[[  $time ](fg:muted bg:tier5)]($style)'

[os]
style = "bg:head fg:text_dark"
format = "[ $symbol ]($style)"
disabled = false

# local: username shown only when relevant — root, another user, or a remote
# session (also when sudo stripped the SSH_* variables, via CB_PROMPT_REMOTE).
# Root: red bold text only, the red block on the input line is the eye-catcher.
[username]
detect_env_vars = ["CB_PROMPT_REMOTE"]
style_user = "bg:head fg:text_dark"
style_root = "bg:head fg:error bold"
format = "[$user ]($style)"

# local: remote host, replaces the hostname module (see format above)
[env_var.CB_PROMPT_REMOTE]
style = "bg:head fg:text_dark bold"
format = "[☍ $env_value ]($style)"  # same ssh marker as the old p9k prompt

# local: root marker in front of the input line, old p9k style
[env_var.CB_PROMPT_ROOT]
format = "[ ▲ λ ](bg:error fg:bright bold)[](fg:error) "

# local: input line, old p9k style λ block in the clock segment colours
# (non-root; root shells drop $character, see above). Same width in every state
# so the input column stays fixed: red ✘ = last command failed, blue λ on a
# lighter block = vi command mode (`bindkey -v`; emacs mode is the default).
[character]
format = "$symbol "
success_symbol = "[ λ ](bg:tier5 fg:muted bold)[](fg:tier5)"
error_symbol = "[ ✘ ](bg:tier5 fg:error bold)[](fg:tier5)"
vimcmd_symbol = "[ λ ](bg:tier3 fg:accent bold)[](fg:tier3)"
vimcmd_visual_symbol = "[ λ ](bg:tier3 fg:accent bold)[](fg:tier3)"
vimcmd_replace_symbol = "[ λ ](bg:tier3 fg:accent bold)[](fg:tier3)"
vimcmd_replace_one_symbol = "[ λ ](bg:tier3 fg:accent bold)[](fg:tier3)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

# local: colour roles shared by every palette below — head = first segment
# colour (see format above), accent/tier3-5 = the segment background gradient
# (brightest to darkest), text_dark/bright = fixed-contrast text on head/error
# blocks, muted = time text, error = root/failed-command red.
[palettes.local]
head = "#a3aed2"
accent = "#769ff0"
tier3 = "#394260"
tier4 = "#212736"
tier5 = "#1d2230"
text_dark = "#0a0b0f"
muted = "#a0a9cb"
error = "#c54544"
bright = "#ffffff"

# Same as [palettes.local] except for `head` — used for the ssh/root variant
# regardless of which theme is active above (see ~/.zshrc sed).
[palettes.remote]
head = "#e0af68"  # tokyo night yellow
accent = "#769ff0"
tier3 = "#394260"
tier4 = "#212736"
tier5 = "#1d2230"
text_dark = "#0a0b0f"
muted = "#a0a9cb"
error = "#c54544"
bright = "#ffffff"

# Eldritch adaptations (https://github.com/eldritch-theme/starship) — colours
# only, best effort; same role set as [palettes.local] above.
[palettes.eldritch_cthulhu]
head = "#a48cf2"       # purple
accent = "#04d1f9"      # cyan
tier3 = "#454759"       # surface
tier4 = "#323449"       # currentline
tier5 = "#212337"       # background
text_dark = "#212337"   # background
muted = "#7081d0"       # comment
error = "#f16c75"       # red
bright = "#ebfafa"      # foreground

[palettes.eldritch_abyss]
head = "#8b75d9"        # purple
accent = "#0396b3"      # cyan
tier3 = "#353746"       # surface
tier4 = "#252738"       # currentline
tier5 = "#171928"       # background
text_dark = "#171928"   # background
muted = "#506299"       # comment
error = "#cc5860"       # red
bright = "#d8e6e6"      # foreground
