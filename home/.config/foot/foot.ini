# ~/.config/foot/foot.ini — foot terminal configuration
# Only overrides foot's built-in defaults; anything unset keeps the default.
# Reference: man 5 foot.ini — https://codeberg.org/dnkl/foot
# Themes: https://github.com/mbadolato/iTerm2-Color-Schemes
# Requires foot >= 1.26 ([colors-dark]/[colors-light]; 1.28 dropped the old
# [colors]/[colors2] names).

[main]
font=monospace:pixelsize=12
#font=FiraMono Nerd Font:pixelsize=12
# Render bold text in palette colors 0-7 with the bright variant (8-15), like
# xfce4-terminal's "bold is bright" and VS Code's drawBoldTextInBrightColors.
bold-text-in-bright=palette-based

# The two palettes live in their own files so bin/foot-theme can replace one
# without touching this file (foot-theme save dark|light THEME). Theme library
# for trying out and picking from: ~/.config/foot/themes/ (foot-theme list).
# Note: [colors-light] is reported as the *light* theme to applications that
# query the color scheme (mode 2031), even when its palette is dark.
include=~/.config/foot/theme-dark.ini
include=~/.config/foot/theme-light.ini

[key-bindings]
# Switch between the [colors-dark] and [colors-light] palettes (not a foot
# default). Also drops any palette a foot-theme apply set in this window.
color-theme-toggle=Control+Shift+t

# Pipe the visible screen / full scrollback to an fzf picker (bin/foot-fzf-pick,
# linked into ~/bin) and copy the chosen line(s)/token(s) to the clipboard — a
# keyboard-only way to grab a path/hash/word from command output *above* the
# prompt, without the mouse. Paste with Ctrl+Shift+v (or middle-click).
#   Ctrl+Shift+g  → pick from the current screen
#   Ctrl+Shift+b  → pick from the whole scrollback
# foot-fzf-pick must be reachable on foot's $PATH (it is under sway launched
# from a login shell). Neither key is a foot default, so nothing is shadowed.
pipe-visible=[foot-fzf-pick] Control+Shift+g
pipe-scrollback=[foot-fzf-pick] Control+Shift+b
