# Tango Black
# Tango palette on pure black, copied from the xfce4-terminal setup
# (xfconf-query -c xfce4-terminal -p /color-palette). foot's built-in default
# (bg 242424, light cyan-ish blue 24acd4, pinkish red f62b5a) made light text
# on blue/red backgrounds nearly unreadable.
[colors-dark]
foreground=ffffff
background=000000

regular0=000000
regular1=cc0000
regular2=4e9a06
regular3=c4a000
regular4=3465a4
regular5=75507b
regular6=06989a
regular7=d3d7cf
bright0=555753
bright1=ef2929
bright2=8ae234
bright3=fce94f
bright4=739fcf
bright5=ad7fa8
bright6=34e2e2
bright7=eeeeec
