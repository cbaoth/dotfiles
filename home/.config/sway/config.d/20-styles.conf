# {{{ = Styles ===============================================================
# window borders: bare values for default_border / default_floating_border;
# in commands use them as `border $border_xxx`
set $border_default normal 2
set $border_floating normal 2
set $border_floating_stick normal 4
set $border_pop none
# sticky windows: pin badge in front of the title (font is pango:, so markup
# renders; sway escapes %title itself). The badge has its own bg/fg, so it reads
# the same focused or not; the title keeps client.* text colors (focus-aware).
# Use as `title_format "$title_sticky"`
set $title_sticky <span background='$base01' foreground='$base00'> 📌 </span> %title

# default font (Pango name == fontconfig family; size is parsed separately)
#   list all families:  fc-list : family | sort -u
#   monospaced only:     fc-list :spacing=100 family | sort -u
#   search a family:     fc-list | grep -i fira
#   test what a name resolves to:  fc-match "FiraCode Nerd Font"
# NB: an unknown/misspelled family silently falls back to a sans default
#     (here: Noto Sans) while the size still applies -- always confirm the
#     family with fc-match. e.g. "Fira Code" is NOT installed, only the
#     "FiraCode Nerd Font" variant is.
#font pango:Monospace 9
#font pango:Monospace Bold 10
#font pango:Terminus 9
#font pango:DejaVu Sans Mono 9
#font pango:DejaVu Sans Mono Bold 10
#font pango:Roboto 9
font pango:DejaVu Sans Condensed 10
#font pango:Ubuntu Sans Mono SemiBold 9
#font pango:FiraMono Nerd Font Mono 9
#font pango:FiraMono Nerd Font Mono Medium 9
#font pango:FiraMono Nerd Font Mono Bold 9
#font pango:FiraMono Nerd Font 9

# default layout: tabbed
workspace_layout tabbed

# SWAY: new_window → default_border, new_float → default_floating_border
# new tiling windows with title bar and borders
default_border $border_default
# new floating windows with title bar and without borders
default_floating_border $border_floating
# hide borders on edges
#hide_edge_borders both
# hide borders on edges, but not when only one (maximized) window exists
# https://github.com/swaywm/sway/issues/5551#issuecomment-658920158
hide_edge_borders --i3 smart_no_gaps

titlebar_padding 1
titlebar_border_thickness 0

focus_follows_mouse yes
focus_wrapping no
popup_during_fullscreen leave_fullscreen
#workspace_auto_back_and_forth yes

