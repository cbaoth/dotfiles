# {{{ = Output / Input =======================================================
# Configure your outputs (monitors) here.
# Run: swaymsg -t get_outputs   (to list available outputs)

# LG Electronics 38GN950 (3840x1600 ultrawide) on DP-1
# Detected from log: LG Electronics 38GN950 205NTMX6L403
output DP-1 resolution 3840x1600 position 0,0
# output DP-1 scale 1.25  # optional HiDPI scaling

# Desktop background (replaces xsetroot / feh)
# SWAY: sway handles wallpaper natively via output
# Fallback; overridden below by sway-wallpaper if this host has one set up
output * bg #000000 solid_color
# Per-host wallpaper, managed with `sway-wallpaper` (set/link/copy/rm/get):
# ~/.local/share/wallpapers/<hostname> (a symlink or copy, not committed --
# host-local, extension-agnostic). Not set up on this host -> silently keeps
# the solid_color fallback above. exec_always re-applies it on every reload.
exec_always sway-wallpaper set

# {{{ - Input ----------------------------------------------------------------
# Run: swaymsg -t get_inputs   (to list input identifiers)
# https://man.archlinux.org/man/sway-input.5

input "type:keyboard" {
    # Three XKB layout groups, cycled via Scroll_Lock or mod-Insert (kbd-layout-toggle):
    #   Group 1 - custom(extend): Colemak + DreymaR's Extend layer (CapsLock held)  ← default
    #   Group 2 - custom(basic):  Colemak
    #   Group 3 - custom(qwerty): plain US QWERTY
    # All groups: CapsLock = Ctrl (Extend key in group 1), ISO key = Hyper_L (Mod3),
    # NumLock disabled (its Mod2 went to Extend; see the "mods" comment in custom).
    # AltGr layer provides umlauts: AltGr+q=ä  AltGr+s=ß  AltGr+a=á  etc.
    # Symbols files: ~/.config/xkb/symbols/{custom,extend} (dotfiles symlinks)
    # libxkbcommon searches ~/.config/xkb/ before system paths automatically.
    xkb_layout  "custom,custom,custom"
    xkb_variant "extend,basic,qwerty"
    # Keypad always types digits (there is no NumLock any more).
    xkb_options numpad:mac

    # xkb_options lv3:ralt_switch  # uncomment if AltGr stops working

    # Key repeat (mirrors xsession: xset r 66)
    # CapsLock/Backspace repeats because repeat applies to all keys
    repeat_delay 300
    repeat_rate  30
}

# For Logitech devices it is recommended to use solaar e.g. to set the DPI values above 1000 (fallback)
# sudo apt-get install -y solaar
# sudo udevadm control --reload-rules
# sudo udevadm trigger
# solaar
input "type:pointer" {
    # Assumes mouse sensitivity setting of 2000 DPI, e.g. via Solaar
    accel_profile "adaptive"    # adaptive (default): acceleration based on speed
    pointer_accel 0.25
    #accel_profile "flat"        # flat: no acceleration, 1:1 movement
    #pointer_accel 0.75
}

# For notebook touchpad
input "type:touchpad" {
    dwt              enabled    # disable while typing
    tap              enabled    # enable click-on-tap
    tap_button_map   lrm        # map 1/2/3 finger tab to left/right/middle click
    natural_scroll   disabled   # invert scroll direction: swipe down scroll down (vs. irl / touch screen dragging)
    scroll_factor    1.5        # increase scroll speed
    middle_emulation enabled    # map left+right to middle click
}

