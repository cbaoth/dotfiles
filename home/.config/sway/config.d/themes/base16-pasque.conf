# Author: Gabriel Fontes (https://github.com/Misterio77)
# Source: Source: https://github.com/rkubosz/base16-sway/blob/master/themes/

set $base00 #271C3A
set $base01 #100323
set $base02 #3E2D5C
set $base03 #5D5766
set $base04 #BEBCBF
set $base05 #DEDCDF
set $base06 #EDEAEF
set $base07 #BBAADD
set $base08 #A92258
set $base09 #918889
set $base0A #804ead
set $base0B #C6914B
set $base0C #7263AA
set $base0D #8E7DC6
set $base0E #953B9D
set $base0F #59325C

# focused-window title (bg=$base0D) and urgent title (bg=$base08) are both
# bright enough that dark text reads far better than this theme's own light
# foreground (checked via WCAG contrast: ~8.5:1 and ~5.3:1 dark vs ~1.7:1 and
# ~2.7:1 light).
# default
# set $textp $base05
# set $texts $base00
# inverted
set $textp $base00
set $texts $base05
# all texts use theme's primary text color
# set $textp $base05
# set $texts $base05
# all text use theme's secondary text color
# set $textp $base00
# set $texts $base00
# increased contrast
# set $textp $base06
# set $texts $base03
# }}} Base16 - Pasque --------------------------------------------------------
