# {{{ Eldritch - Abyss (dark, cbaoth version) --------------------------------
# Source: https://github.com/eldritch-theme/eldritch
# Variant of Eldritch Abyss theme with primary color changed and brightness
# of inactive colors increased (otherwise identical with Eldritch terminal
# background color)

#set $base00 #171928
set $base00 #252738
#set $base01 #506299
set $base01 #353E67
set $base02 #252738
set $base03 #353746
set $base04 #474852
set $base05 #d8e6e6
set $base06 #d8e6e6
set $base07 #d8e6e6
set $base08 #cc5860
set $base09 #d4a666
set $base0A #ccd663
set $base0B #0396b3
set $base0C #2dcc82
set $base0D #2dcc82
set $base0E #8b75d9
set $base0F #d154a1

# same fix as the other themes here: dark text reads noticeably better than
# this theme's own light foreground on both the focused title (bg=$base0D)
# and the urgent title (bg=$base08) -- checked via WCAG contrast: ~5.0:1 and
# ~4.3:1 dark vs ~2.7:1 and ~3.2:1 light.
# default
# set $textp $base05
# set $texts $base00
# inverted
set $textp $base00
set $texts $base05
# all texts use theme's primary text color
# set $textp $base05
# set $texts $base05
# all text use theme's secondary text color
# set $textp $base00
# set $texts $base00
# increased contrast
# set $textp $base06
# set $texts $base03
# }}} Eldritch - Abyss (dark, cbaoth version) --------------------------------
