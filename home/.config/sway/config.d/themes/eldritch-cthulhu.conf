# {{{ Eldritch - Cthulhu (default) ---------------------------------------------
# Source: https://github.com/eldritch-theme/eldritch
# Dark blue-grey backgrounds with green and blue accents.
# base16 role <- eldritch color (hex)
#   base00 <- background    (#212337)   base08 <- red     (#f16c75)
#   base01 <- currentline   (#323449)   base09 <- orange  (#f7c67f)
#   base02 <- surface       (#454759)   base0A <- yellow  (#f1fc79)
#   base03 <- comment       (#7081d0)   base0B <- green   (#37f499)
#   base04 <- overlay       (#5b5c66)   base0C <- cyan    (#04d1f9)
#   base05 <- foreground    (#ebfafa)   base0D <- cyan    (#04d1f9, reused: no distinct "blue")
#   base06 <- foreground, reused        base0E <- purple  (#a48cf2)
#   base07 <- foreground, reused        base0F <- pink    (#f265b5, reused: no "brown")

set $base00 #212337
set $base01 #323449
set $base02 #454759
set $base03 #7081d0
set $base04 #5b5c66
set $base05 #ebfafa
set $base06 #ebfafa
set $base07 #ebfafa
set $base08 #f16c75
set $base09 #f7c67f
set $base0A #f1fc79
set $base0B #37f499
set $base0C #04d1f9
set $base0D #04d1f9
set $base0E #a48cf2
set $base0F #f265b5

# focused-window title (bg=$base0D) and urgent title (bg=$base08) are both
# bright enough that dark text reads far better than this theme's own light
# foreground (checked via WCAG contrast: ~8.5:1 and ~5.3:1 dark vs ~1.7:1 and
# ~2.7:1 light).
# default
# set $textp $base05
# set $texts $base00
# inverted
set $textp $base00
set $texts $base05
# all texts use theme's primary text color
# set $textp $base05
# set $texts $base05
# all text use theme's secondary text color
# set $textp $base00
# set $texts $base00
# increased contrast
# set $textp $base06
# set $texts $base03
# }}} Eldritch - Cthulhu -------------------------------------------------------
