# {{{ Eldritch - Cthulhu (default, cbaoth version) ---------------------------
# Source: https://github.com/eldritch-theme/eldritch
# Variant of Eldritch Cthulhu theme with primary color changed and brightness
# of inactive colors increased (otherwise identical with Eldritch terminal
# background color)

#set $base00 #212337
set $base00 #323449
#set $base01 #7081d0
set $base01 #434E80
set $base02 #212337
set $base03 #454759
set $base04 #5b5c66
set $base05 #ebfafa
set $base06 #ebfafa
set $base07 #ebfafa
set $base08 #f16c75
set $base09 #f7c67f
set $base0A #f1fc79
set $base0B #04d1f9
set $base0C #37f499
set $base0D #37f499
set $base0E #a48cf2
set $base0F #f265b5

# focused-window title (bg=$base0D) and urgent title (bg=$base08) are both
# bright enough that dark text reads far better than this theme's own light
# foreground (checked via WCAG contrast: ~8.5:1 and ~5.3:1 dark vs ~1.7:1 and
# ~2.7:1 light).
# default
# set $textp $base05
# set $texts $base00
# inverted
set $textp $base00
set $texts $base05
# all texts use theme's primary text color
# set $textp $base05
# set $texts $base05
# all text use theme's secondary text color
# set $textp $base00
# set $texts $base00
# increased contrast
# set $textp $base06
# set $texts $base03
# }}} Eldritch - Cthulhu (default, cbaoth version) ---------------------------
