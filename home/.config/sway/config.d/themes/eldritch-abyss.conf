# {{{ Eldritch - Abyss (darker) -------------------------------------------------
# Source: https://github.com/eldritch-theme/eldritch
# Near-black backgrounds with muted accent colors.
# base16 role <- eldritch color (hex)
#   base00 <- background    (#171928)   base08 <- red     (#cc5860)
#   base01 <- currentline   (#252738)   base09 <- orange  (#d4a666)
#   base02 <- surface       (#353746)   base0A <- yellow  (#ccd663)
#   base03 <- comment       (#506299)   base0B <- green   (#2dcc82)
#   base04 <- overlay       (#474852)   base0C <- cyan    (#0396b3)
#   base05 <- foreground    (#d8e6e6)   base0D <- cyan    (#0396b3, reused: no distinct "blue")
#   base06 <- foreground, reused        base0E <- purple  (#8b75d9)
#   base07 <- foreground, reused        base0F <- pink    (#d154a1, reused: no "brown")

set $base00 #171928
set $base01 #252738
set $base02 #353746
set $base03 #506299
set $base04 #474852
set $base05 #d8e6e6
set $base06 #d8e6e6
set $base07 #d8e6e6
set $base08 #cc5860
set $base09 #d4a666
set $base0A #ccd663
set $base0B #2dcc82
set $base0C #0396b3
set $base0D #0396b3
set $base0E #8b75d9
set $base0F #d154a1

# same fix as the other themes here: dark text reads noticeably better than
# this theme's own light foreground on both the focused title (bg=$base0D)
# and the urgent title (bg=$base08) -- checked via WCAG contrast: ~5.0:1 and
# ~4.3:1 dark vs ~2.7:1 and ~3.2:1 light.
# default
# set $textp $base05
# set $texts $base00
# inverted
set $textp $base00
set $texts $base05
# all texts use theme's primary text color
# set $textp $base05
# set $texts $base05
# all text use theme's secondary text color
# set $textp $base00
# set $texts $base00
# increased contrast
# set $textp $base06
# set $texts $base03
# }}} Eldritch - Abyss ---------------------------------------------------------
