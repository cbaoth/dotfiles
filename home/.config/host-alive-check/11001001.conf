# -*- mode: sh; sh-shell: bash; indent-tabs-mode: nil; tab-width: 2 -*-
# vim: ft=bash:et:ts=2:sts=2:sw=2
# code: language=bash insertSpaces=true tabSize=2
# shellcheck shell=bash disable=SC2148,SC2034
#
# ~/.config/host-alive-check/11001001.conf: external probes of the vserver.
#
# Runs on saito only (systemctl --user enable --now host-alive-check@11001001.timer).
# Deployed to every host by dotfiles-link, but inert without the timer.
#
# fail2ban: every probe below was checked against the vserver's jails (see
# ~/notes/systems/11001001/fail2ban/). saito's public IP is NOT in ignoreip, and
# the household shares it, so a ban here would lock *you* out, not just the probe.
#   - http: no URI below matches caddy-botsearch / caddy-nextcloud-probe
#     (/status.php is in the Nextcloud filter's ignoreregex), and none of them
#     404, so caddy-catchall cannot match either.
#   - ssh: banner only, never an auth attempt. Logs one
#     "Connection closed by <ip> port <n> [preauth]" per run, which the sshd
#     filter treats as NOFAIL in its default `mode = normal`. If the sshd jail
#     is ever switched to `mode = ddos` or `aggressive`, those lines COUNT —
#     5 runs (10 min) would trip maxretry 4. Drop the ssh check first.
#   - netdata: over the tailnet, which is in ignoreip and never passes Caddy.

HOST_LABEL="11001001"

# KIND|NAME|TARGET|REGEX — REGEX (grep -E) is matched against the body (http)
# or the SSH banner (ssh). Matches mirror ~/notes/systems/11001001/monitoring/
# go.d-httpcheck.conf, which checks the same URLs from the inside.
CHECKS=(
  # Redirects to the sign-in page; the form proves "up AND still private".
  'http|forgejo|https://git.11001001.org/|action="/user/login"'
  # status.php is 200 even in maintenance mode — match the body.
  'http|nextcloud|https://nc.11001001.org/status.php|"maintenance":false'
  'http|silverbullet|https://notes.11001001.org/|\.client/'
  'ssh|ssh|11001001.org:8090|^SSH-2\.0-'
  # The tailnet path. Always the FQDN: bare `11001001` parses as an integer IP.
  'http|tailnet|http://11001001.bone-shade.ts.net:19999/api/v1/info|"version"'
)

FAIL_THRESHOLD=3     # x 2 min timer = alert after ~6 min
REMIND_SECS=3600
