# -*- mode: sh; sh-shell: bash; indent-tabs-mode: nil; tab-width: 2 -*-
# vim: ft=bash:et:ts=2:sts=2:sw=2
# code: language=bash insertSpaces=true tabSize=2
# shellcheck shell=bash disable=SC2148
#
# ~/.config/tts/tts-speak.conf: settings for bin/tts-speak (sourced by bash).
# Everything is optional; the values shown are the built-in defaults.

# Engine used when -e is not given: piper | http
#TTS_ENGINE=piper
# Player UI: auto | term | window | none. auto = terminal UI when run from a
# terminal, small mpv window otherwise (hotkey). none = plain pw-play, no controls.
#TTS_UI=auto
# Extra mpv arguments (bash array)
#TTS_MPV_ARGS=(--volume=80 --autofit=600x160)
# Silence (ms) before the first chunk and around saved files; the audio
# device often wakes up late and would swallow the first syllable
#TTS_PAD_MS=250
# Speaking speed, 1.0 = normal. Changes the synthesis itself; to just listen
# faster, prefer mpv's speed (keys [ ], or TTS_MPV_ARGS=(--speed=1.5)): it keeps
# the pitch, and kept sessions (-k) stay at normal speed for later.
#TTS_SPEED=1.0
# Sentences longer than this are split at ; : – (then commas) into lines of
# their own; Piper rushes and slurs a sentence beyond ~13 s (~230 chars).
#TTS_SENTENCE_CHARS=150
# Keep every read-aloud (also from the hotkey) as a session dir under this
# dir: audio/NNNN.wav, playlist.m3u, text.txt, meta.json. Empty = don't keep;
# -k DIR / --no-keep override it per call. WAV is ~2.6 MB per minute.
#TTS_KEEP_DIR="${HOME}/audio/tts"

# Piper: one model per language, chosen by language auto-detection.
# `tts-speak list` shows the installed ones (~/.cache/piper-tts/*.onnx).
#TTS_PIPER_VOICE_DE=de_DE-thorsten-high
#TTS_PIPER_VOICE_EN=en_US-amy-medium
# Piper tuning, KEY=VAL[,KEY=VAL] (-p adds to it); empty = the model's own
# defaults from its .onnx.json "inference". noise_scale: voice variation,
# noise_w: timing variation (lower = steadier, flatter), length_scale: pace
# (-s divides it), sentence_silence: seconds between sentences.
#TTS_PIPER_OPTS="noise_w=0.6,sentence_silence=0.2"
# Pronunciation fixes: piper-LANG.sed here, per book/project in fixes/NAME.sed
# (tts-speak --fixes NAME)
#TTS_PIPER_FIXES_DIR="${HOME}/.config/tts"

# http: any OpenAI-compatible /v1/audio/speech server (Kokoro-FastAPI,
# cb-tts-server from cb-voice-lab, a remote host, ...).
# Voice names are server-specific; empty = server default.
# cb-tts-server: a Voxtral preset (de_female, neutral_male, ...) or a library voice made with
# `cb-vl voice add` (see `cb-vl voice list`). Library voices are cloned from one reference clip, so make
# one voice per language and set it for that language below. The server loads models on demand
# (first request, after idle unload, engine switch); tts-speak warns when the first clip will be slow.
#TTS_HTTP_URL=http://127.0.0.1:8880/v1/audio/speech
#TTS_HTTP_MODEL=tts-1
#TTS_HTTP_VOICE_DE=
#TTS_HTTP_VOICE_EN=
# cb-tts-server: sampling seed (a number, or "random" = a new one per read-aloud) for a different take of the same
# text, and a style instruction for Qwen3 CustomVoice speakers (`tts-speak list` shows the server's voices), e.g.
# TTS_HTTP_VOICE_EN=vivian TTS_INSTRUCT="cheerful, smiling" (in English). Both are also --seed / --instruct.
#TTS_SEED=
#TTS_INSTRUCT=
