# -*- mode: sh; sh-shell: bash; indent-tabs-mode: nil; tab-width: 2 -*-
# vim: ft=bash:et:ts=2:sts=2:sw=2
# code: language=bash insertSpaces=true tabSize=2
# shellcheck shell=bash disable=SC2148
#
# ~/.config/tts/tts-speak.conf: settings for bin/tts-speak (sourced by bash).
# Everything is optional; the values shown are the built-in defaults.

# Engine used when -e is not given: piper | http
#TTS_ENGINE=piper
# Player UI: auto | term | window | none. auto = terminal UI when run from a
# terminal, small mpv window otherwise (hotkey). none = plain pw-play, no controls.
#TTS_UI=auto
# Extra mpv arguments (bash array)
#TTS_MPV_ARGS=(--volume=80 --autofit=600x160)
# Speaking speed, 1.0 = normal
#TTS_SPEED=1.0

# Piper: one model per language, chosen by language auto-detection.
# `tts-speak list` shows the installed ones (~/.cache/piper-tts/*.onnx).
#TTS_PIPER_VOICE_DE=de_DE-thorsten-high
#TTS_PIPER_VOICE_EN=en_US-amy-medium

# http: any OpenAI-compatible /v1/audio/speech server (Kokoro-FastAPI,
# a Chatterbox/Voxtral server from cb-voice-lab, a remote host, ...).
# Voice names are server-specific; empty = server default.
#TTS_HTTP_URL=http://127.0.0.1:8880/v1/audio/speech
#TTS_HTTP_MODEL=tts-1
#TTS_HTTP_VOICE_DE=
#TTS_HTTP_VOICE_EN=
