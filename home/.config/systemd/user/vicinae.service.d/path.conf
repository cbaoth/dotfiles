# The user manager's PATH lacks ~/bin, so launched apps would bypass our
# wrappers (e.g. bin/code). environment.d cannot override PATH on this
# systemd, hence a per-service drop-in. %h = $HOME.
[Service]
Environment=PATH=%h/bin:%h/.local/bin:%h/.local/share/flatpak/exports/bin:/var/lib/flatpak/exports/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
