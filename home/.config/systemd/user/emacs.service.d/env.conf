# Drop-in for the packaged /usr/lib/systemd/user/emacs.service (emacs-pgtk).
# Started from the sway config (`exec systemctl --user start emacs.service`),
# not enabled: the user manager starts at TTY login, before sway, and the
# Wayland env only arrives with sway's dbus-update-activation-environment.
#
# Start through zsh, whose .zshenv sources ~/.common_env: the user manager's
# PATH lacks ~/bin, ~/.local/bin and fnm's node, and Emacs passes its env to
# everything it runs (M-x compile, shell, eglot language servers). `exec'
# keeps emacs as the main PID, which Type=notify needs.
[Service]
ExecStart=
ExecStart=/usr/bin/zsh -c 'exec /usr/bin/emacs --fg-daemon'
