# Drop-in for the packaged /usr/lib/systemd/user/swaync.service.
# Started from the sway config (`exec systemctl --user start swaync.service`),
# like swayosd.service, so it inherits the imported Wayland env.
#
# swaync 0.12.4 crashes when an output goes away (e.g. DP-1 on suspend/resume:
# Gtk-CRITICAL gtk_native_unrealize, then gone). Without a restart, the next
# notification D-Bus-activates whatever else claims org.freedesktop.Notifications
# (mako, while it was still installed), and every swaync-client call (waybar,
# $mod+n keys) blocks waiting for a daemon that never comes back.
# `always` rather than the packaged `on-failure`: covers a clean exit after the
# output loss too. RestartSec=1 keeps a flapping monitor below the default start
# limit (5 starts / 10 s).
[Service]
Restart=always
RestartSec=1
# The user manager's PATH lacks ~/bin, but swaync's hook scripts live there
# (swaync-waybar, swaync-focus-urgent in ~/.config/swaync/config.json).
Environment=PATH=%h/bin:%h/.local/bin:/usr/local/bin:/usr/bin:/bin
