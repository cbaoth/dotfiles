# Replica for bin/rclone-bisync (rclone-bisync@gdrive.timer), used on saito.
# KEY=VALUE only; the file is parsed, not sourced. The remote "gdrive:" (own
# OAuth client, token) lives in ~/.config/rclone/rclone.conf (never in this repo).
LOCAL=/media/data/home/cbaoth/GoogleDrive
REMOTE=gdrive:
MAX_DELETE=5
# Google Docs/Sheets are not files: rclone could only export them, and an
# edited export could not be uploaded back as a Doc. They stay online only.
RCLONE_ARGS=--drive-skip-gdocs
