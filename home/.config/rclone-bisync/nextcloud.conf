# Replica for bin/rclone-bisync (rclone-bisync@nextcloud.timer), used on saito.
# KEY=VALUE only; the file is parsed, not sourced. The remote "nc:" and its
# app password live in ~/.config/rclone/rclone.conf (never in this repo).
LOCAL=/media/data/home/cbaoth/Nextcloud
REMOTE=nc:
# Percent of files bisync may delete in one run before it aborts (~1 600 of
# ~32 000 files).
MAX_DELETE=5
