# ~/.config/nix/nix.conf: per-user Nix settings (system: /etc/nix/nix.conf).
# Docs: docs/setup/nix.md
#
# Flakes and the `nix profile` CLI are still experimental upstream; without
# this, `nix profile add nixpkgs#foo` fails with "experimental Nix feature".
experimental-features = nix-command flakes
