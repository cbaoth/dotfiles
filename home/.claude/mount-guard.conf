# ~/.claude/mount-guard.conf: roots the mount-guard hook asks before touching
#
# One absolute path per line; `#` starts a comment.
#   /path    guarded: Bash/Glob/Grep at or below it needs approval
#   !/path   exception: at or below it passes without a prompt
# Per-project additions: <project>/.claude/mount-guard.local (same format).
#
# Keep in step with the Read/Edit ask rules in ~/.claude/settings.json, which
# guard the built-in file tools (this hook covers Bash/Glob/Grep).

# Client side (saito NFS exports, local NTFS drives)
/srv
/mnt
# Server side, and desktop automounts
/media
/run/media
