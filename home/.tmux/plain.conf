# ~/.tmux/plain.conf

# ----------------------------------------------------------------------------
# Plain status bar for the stock kernel console (client TERM=linux)
# ----------------------------------------------------------------------------
# Sourced by the client-attached / client-session-changed hooks in
# ~/.tmux.conf. The console's bitmap font has no powerline/Nerd glyphs and only
# 16 colors, so catppuccin turns into boxes and smudges there: plain ASCII and
# the 8 base colors instead. Options are global, so the last client to attach
# decides the look; a capable client re-sources ~/.tmux.conf to restore it.
if -F "#{!=:#{client_termname},linux}" {
  if -F "#{@cb_plain}" { source-file ~/.tmux.conf }
} {
  set -g @cb_plain 1

  set -g status-style "bg=blue,fg=black"
  set -g status-left "[#S] "
  set -g status-left-length 20
  set -g status-right " #H %H:%M"
  set -g status-right-length 40

  set -g window-status-separator ""
  set -g window-status-format " #I:#W#F "
  set -g window-status-style "bg=blue,fg=black"
  set -g window-status-current-format " #I:#W#F "
  set -g window-status-current-style "bg=white,fg=black,bold"
  set -g window-status-activity-style "bg=blue,fg=white,bold"
  set -g window-status-bell-style "bg=red,fg=white,bold"

  set -g pane-border-style "fg=white"
  set -g pane-active-border-style "fg=blue"
  set -g pane-border-lines single
  set -g pane-border-status off
  set -g message-style "bg=yellow,fg=black"
  set -g message-command-style "bg=yellow,fg=black"
  set -g mode-style "bg=yellow,fg=black"
}
