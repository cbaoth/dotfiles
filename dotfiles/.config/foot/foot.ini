# ~/.config/foot/foot.ini — foot terminal configuration
# Only overrides foot's built-in defaults; anything unset keeps the default.
# Reference: man 5 foot.ini — https://codeberg.org/dnkl/foot

[main]
font=monospace:pixelsize=12
# Render bold text in palette colors 0-7 with the bright variant (8-15), like
# xfce4-terminal's "bold is bright" and VS Code's drawBoldTextInBrightColors.
bold-text-in-bright=palette-based

[colors]
# Tango palette on pure black, copied from the xfce4-terminal setup
# (xfconf-query -c xfce4-terminal -p /color-palette). foot's built-in default
# (bg 242424, light cyan-ish blue 24acd4, pinkish red f62b5a) made light text
# on blue/red backgrounds nearly unreadable.
background=000000
foreground=ffffff

regular0=000000  # black
regular1=cc0000  # red
regular2=4e9a06  # green
regular3=c4a000  # yellow
regular4=3465a4  # blue
regular5=75507b  # magenta
regular6=06989a  # cyan
regular7=d3d7cf  # white

bright0=555753   # bright black
bright1=ef2929   # bright red
bright2=8ae234   # bright green
bright3=fce94f   # bright yellow
bright4=739fcf   # bright blue
bright5=ad7fa8   # bright magenta
bright6=34e2e2   # bright cyan
bright7=eeeeec   # bright white

[colors2]
# Tokyo Night (night), to match the tokyo-night starship prompt; values from
# folke/tokyonight.nvim extras/foot. Trial: toggle against Tango (colors) with
# Ctrl+Shift+t. Background is the theme's dark navy; set 000000 for pure black.
# NOTE: foot reports colors2 as the *light* theme to apps that query it
# (private mode 2031), so don't leave it as the permanent choice here: once
# decided, move the winner to [colors].
background=1a1b26
foreground=c0caf5
selection-background=283457
selection-foreground=c0caf5
urls=73daca
dim-blend-towards=black  # colors2 defaults to white (light theme)

regular0=15161e  # black
regular1=f7768e  # red
regular2=9ece6a  # green
regular3=e0af68  # yellow
regular4=7aa2f7  # blue
regular5=bb9af7  # magenta
regular6=7dcfff  # cyan
regular7=a9b1d6  # white

bright0=414868   # bright black
bright1=ff899d   # bright red
bright2=9fe044   # bright green
bright3=faba4a   # bright yellow
bright4=8db0ff   # bright blue
bright5=c7a9ff   # bright magenta
bright6=a4daff   # bright cyan
bright7=c0caf5   # bright white

16=ff9e64
17=db4b4b

[key-bindings]
# Switch between the [colors] and [colors2] palettes (not a foot default).
color-theme-toggle=Control+Shift+t

# Pipe the visible screen / full scrollback to an fzf picker (bin/foot-fzf-pick,
# linked into ~/bin) and copy the chosen line(s)/token(s) to the clipboard — a
# keyboard-only way to grab a path/hash/word from command output *above* the
# prompt, without the mouse. Paste with Ctrl+Shift+v (or middle-click).
#   Ctrl+Shift+g  → pick from the current screen
#   Ctrl+Shift+b  → pick from the whole scrollback
# foot-fzf-pick must be reachable on foot's $PATH (it is under sway launched
# from a login shell). Neither key is a foot default, so nothing is shadowed.
pipe-visible=[foot-fzf-pick] Control+Shift+g
pipe-scrollback=[foot-fzf-pick] Control+Shift+b
