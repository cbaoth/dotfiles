"$schema" = 'https://starship.rs/config-schema.json'
# ~/.config/starship.toml — starship prompt configuration
# Base: the tokyo-night preset (`starship preset tokyo-night`), to be evolved
# step by step. Deviations from the preset are marked with "local:".
# Reference: https://starship.rs/config/
#
# Try another preset without touching this file (it is a symlink into
# dotfiles): `starship-preset-test <name>` (~/.zsh.d/aliases.zsh).

# local: $username and the remote host added to the first segment — the preset
# shows neither, not even over ssh or as root. The segment colour is the
# palette colour `head`: blue-grey locally, amber in a remote session.
#
# Remote/root state comes from ~/.zshrc (PROMPT section), not from starship's
# own ssh detection, which sudo/su defeat by stripping the SSH_* variables:
#   CB_PROMPT_REMOTE  short hostname (uppercase), set only in a remote session
#   CB_PROMPT_ROOT    set only when EUID is 0
# For remote and/or root ~/.zshrc points STARSHIP_CONFIG at a generated copy
# of this file (sed: `palette = "remote"`; root drops the `$character"""` line,
# keep it on a line of its own); edit only this file.
palette = "local"

format = """
[░▒▓](fg:head)\
$os\
$username\
${env_var.CB_PROMPT_REMOTE}\
[](bg:#769ff0 fg:head)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n${env_var.CB_PROMPT_ROOT}\
$character"""

[directory]
style = "fg:#0a0b0f bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[bun]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

[os]
style = "bg:head fg:#090c0c"
format = "[ $symbol ]($style)"
disabled = false

# local: username shown only when relevant — root, another user, or a remote
# session (also when sudo stripped the SSH_* variables, via CB_PROMPT_REMOTE).
# Root: red bold text only, the red block on the input line is the eye-catcher.
[username]
detect_env_vars = ["CB_PROMPT_REMOTE"]
style_user = "bg:head fg:#090c0c"
style_root = "bg:head fg:#c54544 bold"
format = "[$user ]($style)"

# local: remote host, replaces the hostname module (see format above)
[env_var.CB_PROMPT_REMOTE]
style = "bg:head fg:#090c0c bold"
format = "[☍ $env_value ]($style)"  # same ssh marker as the old p9k prompt

# local: root marker in front of the input line, old p9k style
[env_var.CB_PROMPT_ROOT]
format = "[ ▲ λ ](bg:#c54544 fg:#ffffff bold)[](fg:#c54544) "

# local: input line, old p9k style λ block in the clock segment colours
# (non-root; root shells drop $character, see above). Same width in every state
# so the input column stays fixed: red ✘ = last command failed, blue λ on a
# lighter block = vi command mode (`bindkey -v`; emacs mode is the default).
[character]
format = "$symbol "
success_symbol = "[ λ ](bg:#1d2230 fg:#a0a9cb bold)[](fg:#1d2230)"
error_symbol = "[ ✘ ](bg:#1d2230 fg:#c54544 bold)[](fg:#1d2230)"
vimcmd_symbol = "[ λ ](bg:#394260 fg:#769ff0 bold)[](fg:#394260)"
vimcmd_visual_symbol = "[ λ ](bg:#394260 fg:#769ff0 bold)[](fg:#394260)"
vimcmd_replace_symbol = "[ λ ](bg:#394260 fg:#769ff0 bold)[](fg:#394260)"
vimcmd_replace_one_symbol = "[ λ ](bg:#394260 fg:#769ff0 bold)[](fg:#394260)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

# local: `head` = colour of the first segment, see format above
[palettes.local]
head = "#a3aed2"

[palettes.remote]
head = "#e0af68"  # tokyo night yellow
