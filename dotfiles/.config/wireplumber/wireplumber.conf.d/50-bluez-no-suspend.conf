# Disable idle-suspend for Bluetooth audio *output* nodes.
#
# Why: WirePlumber's suspend-node hook sends a "Suspend" command to any Audio
# node that has been idle for >= 5s (session.suspend-timeout-seconds, default 5).
# On A2DP headsets (notably the Sony WH-1000XM4) the transport often fails to
# resume cleanly after such a suspend: the sink reports RUNNING but no PCM
# reaches the headset -> silence until the profile is cycled. mpv makes this
# near-constant with short clips, because every exit releases the stream and the
# gap before the next clip crosses the 5s idle window.
#
# Setting the timeout to 0 makes suspend-node.lua return early (see
# /usr/share/wireplumber/scripts/node/suspend-node.lua) so the node is never
# suspended. Scoped to bluez_output.* only: ALSA sinks keep power-saving suspend,
# and the bluez *input* (mic/HFP) is left untouched.
#
# Manual kick if it still happens: `bt-audio-reset` (bound in Sway system mode).
#
# Note: this rule reaches the transport-bound *device* node
# (bluez_output_internal.*, device.api=bluez5) — the one whose suspend actually
# breaks the A2DP link. The front-end loopback sink apps connect to
# (bluez_output.AC:*) keeps suspend-timeout unset, which is fine: its suspend is
# harmless. Verify with:
#   pw-dump | jq -r '.[].info.props | select(."node.name"|startswith("bluez_output"))
#                     | "\(."node.name") \(."session.suspend-timeout-seconds")"'

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
