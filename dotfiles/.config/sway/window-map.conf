# -*- mode: conf; indent-tabs-mode: nil -*-
# vim: ft=conf:et:ts=2:sts=2:sw=2
#
# Window -> workspace map for bin/sway-arrange ($mod+Alt+x).
#
# This is data, not sway config: sway never reads this file. It exists because
# per-project placement CANNOT be done with sway rules -- at the window::new
# event a VS Code window's title is still null (measured 2026-09-30), and the
# folder name only arrives in a later title event. `assign` is evaluated once at
# map time, so it can never see the folder; `for_window` would see it but then
# re-fires later and drags windows back (see 70-window-rules.conf header).
# Hence: an explicit, on-demand sweep instead of a rule.
#
# FORMAT
#   [apps]   <alias>  <criteria-key>=<regex>
#            criteria-key is app_id or class. The regex is PCRE, matched
#            UNANCHORED (substring) exactly like sway's own criteria, so anchor
#            with ^...$ when you mean the whole string.
#
#   [rules]  <alias>  <title-regex>  <workspace>
#            First matching rule wins, top to bottom. `-` as the title-regex is
#            a catch-all for that app. Workspace may be a $wsN variable (read
#            from the sway config via `sway-ws list`) or a literal name.
#
# TAB ORDER: within one workspace, the order the rules appear here IS the
# left-to-right tab order. Windows that only hit the catch-all are placed after
# the explicitly listed ones, keeping their existing relative order.
#
# Grouping into a tabbed container needs no rules here -- `workspace_layout
# tabbed` (20-styles.conf) already makes sway do it.

[apps]
# VS Code: app_id is com.microsoft.VSCode on this build; the short "code" form
# is matched too, since Microsoft's .deb has used it historically.
code     app_id=^(code|com\.microsoft\.VSCode)$

# Browsers, as actually installed here (firefox-nightly, vivaldi-snapshot) --
# the channel suffix is why these are not anchored at the end.
browser  app_id=^(firefox|vivaldi|google-chrome|chromium|brave-browser|microsoft-edge)

[rules]
# --- VS Code -------------------------------------------------------------
# ws4 "Create" -- these projects live there rather than in Devel.
code     cb-voice-lab                 $ws4
code     AIMetaTools                  $ws4
# ws3 "Devel" -- listed ones first, in this tab order, then everything else.
code     dotfiles                     $ws3
code     notes                        $ws3
code     -                            $ws3

# --- Browsers ------------------------------------------------------------
# Game-related windows to ws5 "Gaming" before the general catch-all.
browser  (?i)(steam|lutris|nexusmods|protondb|pathofexile) $ws5
browser  -                            $ws2
