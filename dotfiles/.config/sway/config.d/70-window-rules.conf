# for_window [app_id="(?i)brave-browser(-.+)?"]              move container to workspace $ws2
# for_window [app_id="(?i)vivaldi(-.+)?"]                    move container to workspace $ws2
# }}} - Workspace 2 - Web ----------------------------------------------------

