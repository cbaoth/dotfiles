# {{{ - Floating -------------------------------------------------------------
# Float by custom window_role=i3float (XWayland apps only, for i3 backward compatibility)
for_window [window_role="^i3float$"]                       $float

# Float by custom app_id=swayfloat (e.g. `exec {app} --app-id=swayfloat`)
for_window [app_id="(?i)^swayfloat$"]                      $float

# Web Browsers
for_window [title="(?i)(^|[ ._-])(Task[ ._-]?Manager)([ ._-]|$)"] $float

# Communication and social apps
for_window [app_id="(?i)^org\.signal\.Signal$"]            $float

# File tools
for_window [app_id="(?i)^peazip$"]                         $float

# Gaming
for_window [app_id="(?i)(^|[ ._-])(lutris|hgl|ProtonPlus)$"] $float
for_window [class="(?i)(^|[ ._-])(steam|PortProton)$"]     $float
for_window [title="(?i)(Games Launcher|battle\.net)$"]     $float
for_window [app_id="zenity"][title="^Winetricks"]          $float
for_window [app_id="yad"][title="^Protontricks"]           $float
# }}} - Floating -------------------------------------------------------------

# {{{ - Popups, Dialogs, Small -----------------------------------------------
# Media player (note: avoid || in regex — empty alternative matches Wayland apps with no class)
for_window [app_id="(?i)^mpv|spotify"]                     $pop
for_window [class="(?i)^(mpv|vlc|spotify)$"]               $pop

# Various system settings and related windows
for_window [app_id="(?i)^org.gnome.settings$"]             $pop
for_window [app_id="(?i)^com.github.tchx84.Flatseal$"]     $pop
for_window [app_id="(?i)^ulauncher$"]                      $pop
for_window [app_id="(?i)^org.gnome.Software$"]             $pop
for_window [app_id="(?i)(^|[ ._-])(nvidia-settings|solaar)"] $pop

# Dialog windows
# for_window [title="(?i)(^|[ ._-])(Preferences|Settings|Options)([ ._-]|$)"] \
for_window [class="(?i)^Doublecmd$"] \
             [title="(?i)^(Options|File operations)$"]     $pop
for_window [class="(?i)^Ssvnc$"] \
             [instance="(?i)^popup$"]                      $pop

# System info/resources/monitoring/debug windows
for_window [app_id="^term\.top$"]                          $pop_sheer
for_window [app_id="^io.missioncenter.MissionCenter$"]     $pop_sheer
for_window [app_id="^net.nokyan.Resources$"]               $pop
for_window [app_id="^wev$"]                                $pop_sheer, move position cursor
for_window [app_id="^dev.deedles.Trayscale$"]              $pop_sheer

# Remote desktop windows
for_window [app_id="vncviewer$"]                           $pop
for_window [app_id="^scrcpy$"]                             $pop

# sway-winfo: floating window info monitor (top-left corner, sticky)
# no_focus: prevent the monitor window from stealing focus when it opens,
#   which would otherwise fight focus_follows_mouse and cause erratic behavior.
no_focus   [app_id="^sway-winfo$"]
for_window [app_id="^sway-winfo$"]                         $stick, resize set 560 340, move position 10 10

# KeePassXC (tray)
for_window [app_id="(?i)(^|[ ._-])keepassxc$"]             $poptray, $stick
for_window [class="(?i)(^|[ ._-])keepassxc$"]              $poptray, $stick

# Network manager windows
for_window [app_id="(?i)(^|[ ._-])(nm-applet|nm-connection-editor)$"] $stick

# NordVPN client UI (tray)
for_window [app_id="(?i)^nordvpn-gui$"]                    $poptray_sheer

# Nextcloud client (tray)
for_window [app_id="(?i)(^|[ ._-])nextcloud([ ._-].*|$)"]  $poptray, $stick
for_window [class="(?i)(^|[ ._-])nextcloud([ ._-].*|$)"]   $poptray, $stick

# Flameshot screenshot tool (tray)
for_window [app_id="(?i)^flameshot$"]                      $poptray, $stick

# PulseAudio volume control
for_window [app_id="(?i)pavucontrol$"]                     $poptray, $sheer
for_window [class="(?i)pavucontrol$"]                      $poptray, $sheer

# Blueman bluetooth manager (tray)
for_window [app_id="^blueman-manager$"]                    $poptray, $sheer
for_window [class="^blueman-manager$"]                     $poptray, $sheer

# CopyQ clipboard manager (tray)
for_window [app_id="^com.github.hluk.copyq$"]              $poptray, $sheer

# Firefox pip video player window (e.g. YouTube)
for_window [app_id="(?i)^firefox"] \
             [title="(?i)^Picture.?in.?Picture$"]          $pop, $stick
# Browser Extension: GlobalSpeed - https://github.com/polywock/globalSpeed
# FIXME doesn't work (reliably), maybe the window title changes briefly after creating the window, since they end up with the same properties
# for_window [app_id="(?i)^firefox"] \
#               [title="(?i)^Extension: \(Global Speed - Video Speed Control\)"] $stick
# Browser Extension: GlobalSpeed "into popup" feature (best effort, based on dynamic url specific title)
# for_window [app_id="(?i)^firefox"] \
#               [title="(?i)^https...www\.youtube\.com - "] $stick

# JDownloader main window (Java app with no class/app_id)
# class matches real launcher window "org-jdownloader-update-launcher-
# JDLauncher" (verified live via sway-winfo, dash-bounded "jdownloader" token);
# java-lang-Thread kept for older builds/dialogs that report a generic class.
for_window [class="(?i)(^|[ ._-])(java-lang-Thread|jdownloader)([ ._-]|$)"] \
             [title="(?i)(^|[ ._-])(JDownloader|INFODIALOG)"] $pop, $stick

# Math apps
for_window [app_id="(?i)(^|[ ._-])(calculator|qalculate-\w+|speedcrunch)$"]  $stick
for_window [class="(?i)(^|[ ._-])(galculator|qalculate)$"] $pop

# }}} - Popups, Dialogs, Small -----------------------------------------------

# }}} - Others ---------------------------------------------------------------
# Full screen
for_window [class="(?i)^streaming.?client$"]               fullscreen enable

# Idle inhibit: keep the screen awake while any window is fullscreen (games /
# fullscreen video that does not set its own inhibitor). `inhibit_idle
# fullscreen` only inhibits while the window is actually fullscreen; it
# registers as an application inhibitor. [class=".*"] matches XWayland windows,
# [app_id=".*"] Wayland windows — together, all windows.
for_window [app_id=".*"]                                   inhibit_idle fullscreen
for_window [class=".*"]                                    inhibit_idle fullscreen

# sway-awake (bin/sway-awake): invisible holder window for the *manual* keep-awake
# toggle. Spawned/killed on demand; `inhibit_idle open` holds a *user* idle
# inhibitor for as long as the window exists, distinguishing manual mode from
# application inhibitors (media/games) in `swaymsg -t get_tree`.
# MUST come after the catch-all above so `open` wins over `fullscreen`.
# foot enforces a minimum window size (~72x39), so we cannot shrink it to 1x1;
# instead park it fully off-screen (negative coords) and set opacity 0 so it is
# invisible and cannot catch pointer clicks. inhibit_idle holds while it exists.
no_focus   [app_id="^sway-awake-idle-inhibitor$"]
for_window [app_id="^sway-awake-idle-inhibitor$"]          floating enable, border none, opacity 0, \
                                                             move position -500 -500, inhibit_idle open
# }}} - Others ----------------------------------------------------------------
# }}} - Window Modes ---------------------------------------------------------
# }}} = Window Rules =========================================================
