# {{{ = Styles ===============================================================
# default font
#font pango:monospace 8
#font pango:Terminus 8
font pango:Fira Code 9
#font pango:DejaVu Sans Mono 8

# default layout: tabbed
workspace_layout tabbed

# SWAY: new_window → default_border, new_float → default_floating_border
# new tiling windows with title bar and borders
default_border normal 2
# new floating windows with title bar and without borders
default_floating_border normal 0
# hide borders on edges
hide_edge_borders both
# hide borders when only one (maximized) window exists
#hide_edge_borders smart

focus_follows_mouse yes
focus_wrapping no
popup_during_fullscreen leave_fullscreen
#workspace_auto_back_and_forth yes

# {{{ - Color Theme - Default ------------------------------------------------
# class                  <border>   <background> <text>   [<indicator> [<child_border>]]
# client.focused           #4c7899  #285577    #ffffff #2e9ef4   #285577
# client.focused_inactive  #333333  #5f676a    #ffffff #484e50   #5f676a
# client.unfocused         #333333  #222222    #888888 #292d2e   #222222
# client.urgent            #2f343a  #900000    #ffffff #900000   #900000
# note: .background and .placeholder are ignored (present for i3 compatibility only)
#       .focused_tab_title doesn't seem to be used (used the first three colors of .focused_inactive)
# }}} - Color Theme - Default ------------------------------------------------

