# Source: https://github.com/rkubosz/base16-sway/blob/master/config
#                         Border  BG      Text    Ind     Child Border
client.focused            $base05 $base0D $textp $base0D $base0D
client.focused_inactive   $base01 $base01 $texts $base03 $base01
client.unfocused          $base01 $base00 $texts $base01 $base01
client.urgent             $base08 $base08 $textp $base08 $base08
