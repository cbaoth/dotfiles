# {{{ = Variables ============================================================
# Main mod key (Super_L/Super_R keys, usually the Windows key)
set $mod Mod4

# Alt keys (Alt_L/Alt_R) are Mod1, just use "Alt" in bindssym.
# set $alt   Mod1

# AltGr (ISO_Level3_Shift) is Mod5
set $altgr Mod5

# Hyper mod key (Hyper_L, ISO key between Left Shift and Z on ISO keyboards)
set $hyper Mod3
# Requires ~/.config/xkb/symbols/custom to map <LSGT> to Hyper_L on Mod3, e.g.:
# ----
# xkb_symbols "basic" {
#   include "us(colemak)"
#   name[Group1] = "Colemak (US)";
#   key <LSGT> { [ Hyper_L, Hyper_L ] };
#   modifier_map Mod3 { <LSGT> };
# }
# ----
# https://wiki.archlinux.org/title/Sway#Change_modifier_to_CapsLock_and_keep_Super

# A $mod+x chord prefix was attempted via keyd; it never worked and keyd has
# been dropped. Rationale and the dead ends: docs/TODO.md §3.

# Directional navigation keys
set $left            q
set $right           w
set $up              f
set $down            p

# Directional navigation keys (vim-like hjkl)
#set $left           h
#set $down           j
#set $up             k
#set $right          l

# mode timeout in seconds (used by sway-mode-timeout for all meta modes)
set $mode_timeout_secs 5

# default opacity levels (0.0=transparent, 1.0=opaque, high=default)
set $opacity_high     0.85
set $opacity_mid      0.5
set $opacity_low      0.35

# SWAY: preferred Wayland-native terminal (foot is lightweight and native)
# Alternatives: alacritty, kitty, wezterm, gnome-terminal
set $term            foot
set $termfloat       foot --window-size-chars=120x50 --app-id=swayfloat

# $float: used in for_window rules for windows that should always be floating+borderless
# (not for interactive toggle - use `sway-wstate float` for that via $mod+Alt+t)
set $float           floating enable, border normal 0

# commands to enable/disable sticky with border indicator
# sticky floating windows get border normal 2 to distinguish them visually
set $stick           sticky enable, floating enable, border normal 2
set $unstick         sticky disable, floating enable, border normal 0
# $poptray: right-aligned, flush below the top-right bar (tray) via sway-place.
# Spawned at `opacity 0` and revealed (--opacity) atomically at the destination,
# so it never flashes at screen-center first. No gap, so the pointer never
# crosses another window on the way down (avoids focus-loss auto-close). Nudge
# under the actual tray with e.g. `sway-place top-right -x -220` if the tray is
# not the right-most bar module. $poptray_sheer reveals translucent instead.
set $poptray         sticky enable, floating enable, opacity 0, exec sway-place top-right --opacity 1
set $poptray_sheer   sticky enable, floating enable, opacity 0, exec sway-place top-right --opacity $opacity_high \
                       , mark --add _sheer
# Pop: floating windows that are centered on the screen (e.g. dialogs, modals, etc.)
set $pop             floating enable, border none, move position center
set $pop_sheer       $pop, opacity $opacity_high, mark --add _sheer
# $sheer: translucency for auto-dimmed windows. The `_sheer` mark lets
# `sway-wstate sheer` (mod+Alt+o) toggle them back to opaque in one press.
# (sway 1.11 exposes no opacity over IPC, so the mark is the state, not opacity.)
set $sheer           opacity $opacity_high, mark --add _sheer

# workspace numbers and names
set $ws1             "1:#1 Main"
set $ws2             "2:#2 Web"
set $ws3             "3:#3 Devel"
set $ws4             "4:#4 Create"
set $ws5             "5:#5 Gaming"
set $ws6             "6:#6 Fullscreen"
set $ws7             "7:#7 Misc"
set $ws8             "8:#8 Misc"
set $ws9             "9:#9 Misc"
set $ws10            "10:#10 System"

# other apps and commands
# TODO consider fallback strategy, first existing is used
set $browser         firefox-nightly
# }}} = Variables ============================================================
