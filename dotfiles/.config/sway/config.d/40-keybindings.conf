# {{{ = Key Bindings =========================================================
# {{{ - Window/Container Navigation ------------------------------------------
# alt-F4: close/kill focused window
bindsym Alt+F4               kill

# SWAY: floating_modifier requires 'normal' or 'inverse' as second argument
# Mouse+$mod: drag floating windows
floating_modifier $mod       normal
#tiling_drag off

# mod-Alt-left/right/up/down: change focus
bindsym $mod+Alt+$left       focus left
bindsym $mod+Alt+$right      focus right
bindsym $mod+Alt+$up         focus up
bindsym $mod+Alt+$down       focus down

bindsym $mod+Alt+Left        focus left
bindsym $mod+Alt+Right       focus right
bindsym $mod+Alt+Up          focus up
bindsym $mod+Alt+Down        focus down

bindsym $mod+Shift+Tab       focus left
bindsym $mod+Tab             focus right
bindsym $mod+Shift+grave     focus up
bindsym $mod+grave           focus down

# mod-Alt-Shift-left/right/up/down: move focused window
bindsym $mod+Alt+Shift+$left     move left
bindsym $mod+Alt+Shift+$right    move right
bindsym $mod+Alt+Shift+$up       move up
bindsym $mod+Alt+Shift+$down     move down

bindsym $mod+Alt+Shift+Left      move left
bindsym $mod+Alt+Shift+Right     move right
bindsym $mod+Alt+Shift+Up        move up
bindsym $mod+Alt+Shift+Down      move down

# mod-Shift-left/right: move focused window to prev/next workspace and follow
bindsym $mod+Shift+$left     exec sway-ws move-prev
bindsym $mod+Shift+$right    exec sway-ws move-next
bindsym $mod+Shift+Left      exec sway-ws move-prev
bindsym $mod+Shift+Right     exec sway-ws move-next

# split in horizontal orientation
bindsym $mod+h layout        splith
bindsym $mod+Shift+h         split h

# split in vertical orientation
bindsym $mod+v layout        splitv
bindsym $mod+Shift+v         split v

# enter fullscreen mode for the focused container
bindsym $mod+Alt+z           fullscreen toggle

# toggle sticky state; auto-floats the window, border 2 = sticky indicator
bindsym $mod+Alt+s           exec sway-wstate sticky

# mod-s/t/S: change container layout (toggle-split/tabbed/stacked)
bindsym $mod+s               layout toggle split
bindsym $mod+t               layout tabbed
bindsym $mod+Shift+s         layout stacking
# mod-Alt-t: toggle floating (border 0 = floating, border 2 = tiling/sticky)
bindsym $mod+Alt+t           exec sway-wstate float
# mod-Alt-o: toggle translucency ($opacity_high <-> opaque); makes auto-$sheer
# windows (e.g. nordvpn) readable when low-contrast
bindsym $mod+Alt+o           exec sway-wstate sheer $opacity_high
bindsym $mod+Alt+Shift+o     exec sway-wstate sheer $opacity_mid
bindsym $mod+Alt+Ctrl+o      exec sway-wstate sheer $opacity_low
# mod-p: focus between tiling / floating windows
bindsym $mod+p               focus mode_toggle
# mod-P: switch border style
bindsym $mod+Shift+b         border toggle

# mod-a/A: focus parent/child container
bindsym $mod+a               focus parent
bindsym $mod+Shift+a         focus child
# }}} - Window/Container Navigation ------------------------------------------

# {{{ - Workspace Navigation -------------------------------------------------
# mod-z/Z: move current to / retrieve first window from scratchpad
bindsym $mod+z           move scratchpad
bindsym $mod+Shift+z     scratchpad show
#bindsym $mod+slash      [title="Visual Studio Code$"] scratchpad show

# switch to workspace
bindsym $mod+1           workspace $ws1
bindsym $mod+2           workspace $ws2
bindsym $mod+3           workspace $ws3
bindsym $mod+4           workspace $ws4
bindsym $mod+5           workspace $ws5
bindsym $mod+6           workspace $ws6
bindsym $mod+7           workspace $ws7
bindsym $mod+8           workspace $ws8
bindsym $mod+9           workspace $ws9
bindsym $mod+0           workspace $ws10

# switch workspace previous/next
bindsym $mod+$left       exec sway-ws prev
bindsym $mod+$right      exec sway-ws next

bindsym $mod+Left        exec sway-ws prev
bindsym $mod+Right       exec sway-ws next

# move focused container to workspace and follow (disables sticky mode)
bindsym $mod+Shift+1     sticky disable; move workspace $ws1; workspace $ws1
bindsym $mod+Shift+2     sticky disable; move workspace $ws2; workspace $ws2
bindsym $mod+Shift+3     sticky disable; move workspace $ws3; workspace $ws3
bindsym $mod+Shift+4     sticky disable; move workspace $ws4; workspace $ws4
bindsym $mod+Shift+5     sticky disable; move workspace $ws5; workspace $ws5
bindsym $mod+Shift+6     sticky disable; move workspace $ws6; workspace $ws6
bindsym $mod+Shift+7     sticky disable; move workspace $ws7; workspace $ws7
bindsym $mod+Shift+8     sticky disable; move workspace $ws8; workspace $ws8
bindsym $mod+Shift+9     sticky disable; move workspace $ws9; workspace $ws9
bindsym $mod+Shift+0     sticky disable; move workspace $ws10; workspace $ws10

# mod-b: toggle bar mode (dock↔hide)
bindsym $mod+b bar       mode toggle
# SWAY: bar hidden_state does not exist in Sway; bar mode toggle covers both
# bindsym $mod+Shift+b bar hidden_state toggle
# }}} - Workspace Navigation -------------------------------------------------

# {{{ - Meta Modes -----------------------------------------------------------
# mod-x: window/container mode
set $mode_meta           Window mode | General: (c)lose window | Resize: $left/$right/$down/$up or \
                           Left/Right/Down/Up arrow keys
bindsym $mod+x           mode "$mode_meta"; exec sway-mode-timeout $mode_timeout_secs
mode "$mode_meta" {
    bindsym c            kill, mode "default"

    bindsym $left        resize shrink width  100 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym $right       resize grow   width  100 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym $up          resize grow   height 100 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym $down        resize shrink height 100 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym Shift+$left  resize shrink width   10 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym Shift+$right resize grow   width   10 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym Shift+$up    resize grow   height  10 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym Shift+$down  resize shrink height  10 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs

    bindsym Left         resize shrink width  100 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym Right        resize grow   width  100 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym Up           resize grow   height 100 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym Down         resize shrink height 100 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym Shift+Left   resize shrink width   10 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym Shift+Right  resize grow   width   10 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym Shift+Up     resize grow   height  10 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs
    bindsym Shift+Down   resize shrink height  10 px; mode "$mode_resize"; exec sway-mode-timeout $mode_timeout_secs

    bindsym Return       mode "default"
    bindsym Escape       mode "default"
}

# mod-ESC: system mode
# SWAY: i3-nagbar → swaynag, i3-msg → swaymsg, dm-tool lock → swaylock
#       xsuspend → swaylock -f && systemctl suspend
#       restart  → reload  (sway has no in-place restart equivalent)
set $mode_system Sway: [l]ock, reload-[c]onfigure, e[X]it \
      | Awake: keep-[a]wake (30min [A]uto-off) \
      | System: [S]uspend, [H]ibernate, [R]eboot, shut[D]own
#      | PulseAudio: switch card [p]rofile, restart [P]ipeWire
bindsym $mod+Escape mode "$mode_system"; exec sway-mode-timeout $mode_timeout_secs
mode "$mode_system" {
    # Sway:
    # l: lock screen
    bindsym l                exec swaylock -c 000000, mode "default"
    # c: reload the configuration file (sway has no restart, reload is equivalent)
    bindsym c                reload, mode "default"
    # X: exit sway
    bindsym Shift+x          mode "default"; exec swaynag -t warning \
                               -m 'Do you really want to exit Sway?' \
                               -b 'Exit Sway' 'swaymsg exit'

    # Awake:
    # a: toggle sway-awake (manual keep-awake)
    bindsym a                mode "default"; exec sway-awake toggle
    # A: with 30-min auto-off.
    bindsym Shift+a          mode "default"; exec sway-awake toggle 30m
    # Indicator + click-toggle also available via the waybar custom/sway-awake module.

    # System:
    # S: lock screen + suspend
    bindsym Shift+s          mode "default"; exec swaylock -f -c 000000 && systemctl suspend
    # H: lock screen + hibernate
    bindsym Shift+h          mode "default"; exec swaylock -f -c 000000 && systemctl hibernate
    # Alt+r: reboot
    bindsym Shift+r          mode "default"; exec swaynag -t warning \
                               -m 'Do you really want to reboot the system?' \
                               -b 'Reboot' 'systemctl reboot'
    # D: shut down
    bindsym Shift+d          mode "default"; exec swaynag -t warning \
                               -m 'Do you really want to shut down the system?' \
                               -b 'Shutdown' 'systemctl poweroff'

    ## p: switch audio profile off/on (same pactl commands work via PipeWire compat)
    #bindsym p                mode "default"; \
    #                            exec pactl set-card-profile 0 off; \
    #                            exec sh -c 'sleep 1; pactl set-card-profile 0 output:hdmi-stereo-extra1'
    ## P: restart PipeWire/WirePlumber (replaces pkill pulseaudio)
    #bindsym Shift+p          mode "default"; exec systemctl --user restart wireplumber

    bindsym Return           mode "default"
    bindsym Escape           mode "default"
}

# AltGr+Scroll_Lock: pointer mode
set $mode_pointer Pointer: [p]rofile (adaptive↔flat)  accel [1]=1.0 [2]=0.9 [3]=0.8 [4]=0.7 [5]=0.6 [6]=0.5 [7]=0.4 [8]=0.3 [9]=0.2 [0]=0.0
bindsym $altgr+Scroll_Lock mode "$mode_pointer"; exec sway-mode-timeout $mode_timeout_secs
mode "$mode_pointer" {
    # p: toggle between adaptive (desktop) and flat (gaming) profile
    bindsym p      exec sway-mouse-accel toggle-profile, mode "default"
    # 0-9: set pointer_accel value and exit mode
    bindsym 0      exec sway-mouse-accel 0, mode "default"
    bindsym 1      exec sway-mouse-accel 1, mode "default"
    bindsym 2      exec sway-mouse-accel 2, mode "default"
    bindsym 3      exec sway-mouse-accel 3, mode "default"
    bindsym 4      exec sway-mouse-accel 4, mode "default"
    bindsym 5      exec sway-mouse-accel 5, mode "default"
    bindsym 6      exec sway-mouse-accel 6, mode "default"
    bindsym 7      exec sway-mouse-accel 7, mode "default"
    bindsym 8      exec sway-mouse-accel 8, mode "default"
    bindsym 9      exec sway-mouse-accel 9, mode "default"
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
# }}} - Meta Modes -----------------------------------------------------------

# {{{ - Special Keys ---------------------------------------------------------
# volume media keys (req.: swayosd - handles WirePlumber/PipeWire + Wayland OSD)
bindsym XF86AudioRaiseVolume exec swayosd-client --output-volume raise
bindsym XF86AudioLowerVolume exec swayosd-client --output-volume lower
bindsym XF86AudioMute        exec swayosd-client --output-volume mute-toggle

# mod-Alt-=/-/0: alt. volume keys
bindsym $mod+Alt+equal       exec swayosd-client --output-volume raise
bindsym $mod+Alt+minus       exec swayosd-client --output-volume lower
bindsym $mod+Alt+0           exec swayosd-client --output-volume mute-toggle

# media player keys (req.: playerctl)
bindsym XF86AudioPlay        exec playerctl play-pause
bindsym XF86AudioPrev        exec playerctl previous
bindsym XF86AudioNext        exec playerctl next

# mod-Alt-Space/Slash/,/.: alt. media player keys
bindsym $mod+Alt+Space       exec playerctl play-pause
bindsym $mod+Alt+Slash       exec playerctl play-pause
bindsym $mod+Alt+Comma       exec playerctl previous
bindsym $mod+Alt+Period      exec playerctl next

# SWAY: xbacklight → brightnessctl (works natively on Wayland)
bindsym XF86MonBrightnessUp  exec brightnessctl set +20%
bindsym XF86MonBrightnessDown exec brightnessctl set 20%-

# home button: start browser
bindsym XF86HomePage         exec $browser

# print button: screenshot
# A subtle shutter sound (freedesktop "screen-capture" event) confirms a
# successful screenshot. In fullscreen gamescope, notifications can be occluded,
# but audio always mixes in.
set $camerafx  canberra-gtk-play -i screen-capture
# No visual OSD: in fullscreen gamescope an OSD can be occluded, but audio
# always mixes in.

# The target directory must exist — grim does not create it, it just fails, and
# grimshot reports that as "Error: Unable to invoke grim". Created by
# setup/modules/15-xdg-dirs.sh; see docs/setup/xdg-user-dirs.md.
set $shotdir      ${XDG_SCREENSHOTS_DIR:-$HOME/Pictures/Screenshots}
# Explicit filename: grimshot's default is `date -Ins`, i.e.
# 2026-08-15T14:55:41,457393075+02:00.png — colons, decimal comma and
# nanoseconds. Same prefix format as the photo-renaming aliases (ISO date, then
# the time without separators), plus milliseconds (%3N) so that two shots in
# the same second cannot overwrite each other.
set $shot_screen  grimshot --notify savecopy output "$shotdir/$(date +%Y-%m-%dT%H%M%S.%3N_)screen.png"
set $shot_select  grimshot --notify savecopy anything "$shotdir/$(date +%Y-%m-%dT%H%M%S.%3N_)select.png"

bindsym Print                exec $shot_screen && $camerafx
# bindsym Print                exec flameshot screen && $camerafx
bindsym Ctrl+Print           exec $shot_select && $camerafx
# bindsym Ctrl+Print           exec flameshot gui && $camerafx

# AltGr-[Ctrl-]F8: my common default for all tystems including work/windows
bindsym $altgr+F8            exec $shot_screen && $camerafx
# bindsym $altgr+F8            exec flameshot screen && $camerafx
bindsym $altgr+Ctrl+F8       exec $shot_select && $camerafx
# bindsym $altgr+Ctrl+F8       exec flameshot gui && $camerafx

# Logitech MX Mechanical screenshot key (fn+F8) sends a hardcoded Super+Shift+R
# macro, not Print — bind that combo to the same full-output screenshot action.
bindsym $mod+Shift+r         exec $shot_screen && $camerafx
# bindsym $mod+Shift+r         exec flameshot screen && $camerafx
bindsym $mod+Shift+Ctrl+r    exec $shot_select && $camerafx
# bindsym $mod+Shift+Ctrl+r    exec flameshot gui && $camerafx

# Hyper key: screenshots (alternative to Print)
bindsym $hyper+p             exec $shot_screen && $camerafx
# bindsym $hyper+p             exec flameshot screen && $camerafx
bindsym $hyper+Ctrl+p        exec $shot_select && $camerafx
# bindsym $hyper+Ctrl+p        exec flameshot gui && $camerafx


# mod-l: lock screen (mirrors Windows/GNOME Mod4+L)
bindsym $mod+l               exec swaylock -f -c 000000

# Scroll_Lock: toggle keyboard layout (Colemak ↔ QWERTY)
# Sway intercepts this before passing input to any client, so it works inside
# fullscreen games — useful for switching to Colemak when typing in game chat.
bindsym Scroll_Lock          exec kbd-layout-toggle
# }}} - Special Keys ---------------------------------------------------------

# {{{ - Run Apps: Mod Key ----------------------------------------------------
# core apps only, otherwise use Hyper (see next section)

# mod-return: run terminal (+Alt for floating terminal)
bindsym $mod+Return          exec $term
bindsym $mod+Alt+Return      exec $termfloat

# mod-F8: toggle window info monitor (sway-winfo, hover to inspect any window)
# mod-Shift-F8: toggle focused window in/out of the auto-managed blocklist zone
bindsym $mod+F8              exec sway-winfo --toggle
bindsym $mod+Shift+F8        exec sway-winfo --blocklist-toggle

# mod-space: rofi run launcher
bindsym $mod+space           exec rofi -show combi

# mod-F1 to F3: connect to remote hosts/devices using ssh/scrcpy (+Alt for floating terminal)
bindsym $mod+F1              exec $term      -e ssh -X 11001001.org -p 8090
bindsym $mod+Alt+F1          exec $termfloat -e ssh -X 11001001.org -p 8090
bindsym $mod+F2              exec $term      -e ssh -X -A saito-lan
bindsym $mod+Alt+F2          exec $termfloat -e ssh -X -A saito-lan
bindsym $mod+F3              exec sway-app -m scrcpy -A toggle scrcpy-connect

# mod-Shift-Ctrl-F12: run gnome control center (GNOME Settings) floating
bindsym $mod+Shift+Ctrl+F12  exec DISPLAY=:0 XDG_CURRENT_DESKTOP=GNOME gnome-control-center
# }}} - Run Apps: Mod Key ----------------------------------------------------

# {{{ - Run Apps: Hyper Key --------------------------------------------------
# Run-or-raise convention: $hyper+{key} focuses an existing window if one
# exists (else launches), via bin/sway-app.
# $hyper+Shift+{key} bypasses this and always launches a new instance -- only
# bound for apps where running more than one instance is actually useful.

# hyper-[Shift-]e: web browser
bindsym $hyper+w             exec sway-app $browser
bindsym $hyper+Shift+w       exec $browser

# hyper-[Shift-]e: double-commander file manager
bindsym $hyper+e             exec sway-app doublecmd
bindsym $hyper+Shift+e       exec doublecmd

# hyper-Ctrl-[Shift-]e: nautilus file manager
bindsym $hyper+Ctrl+e        exec sway-app nautilus
bindsym $hyper+Ctrl+Shift+e  exec nautilus

# hyper-Ctrl-t: run *top in floating terminal (alternative binding)
bindsym $hyper+Ctrl+t        exec sway-app -m term.top -A toggle $term --window-size-chars=180x50 \
                                    --app-id=term.top -e htop

# hyper-o: Obsidian, toggle visibility -- focus if hidden/elsewhere, hide to
# scratchpad if already visible, launch if not running. Deterministic
# show/hide for this one app, unlike the FIFO-queue-based scratchpad bindings.
bindsym $hyper+o             exec sway-app -m obsidian -A toggle -- flatpak run md.obsidian.Obsidian

# hyper-Ctrl-n: nordvpn gui, toggle visibility or start single instance
bindsym $hyper+Ctrl+n        exec sway-app -A toggle nordvpn-gui
# }}} - Run Apps: Hyper Key --------------------------------------------------

# {{{ - Run Apps: Other ------------------------------------------------------
# Ctrl-Shift-ESC: run htop in floating terminal
bindsym Ctrl+Shift+Escape    exec Xsway-app -m io\.missioncenter\.MissionCenter -A toggle -- flatpak run io.missioncenter.MissionCenter \
                                    || Xsway-app -A toggle resources \
                                    || sway-app -m term.top -A toggle $term --window-size-chars=180x50 \
                                         --app-id=term.top -e htop
# }}} - Run Apps: Other ------------------------------------------------------
# }}} = Key Bindings =========================================================
