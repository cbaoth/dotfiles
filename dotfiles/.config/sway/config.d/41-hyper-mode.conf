# {{{ = Hyper Mode (ANSI fallback) ============================================
# ANSI keyboards lack the ISO key (<LSGT>) that carries Hyper_L ($hyper), so
# every $hyper binding is mirrored into a mode: mod-y, then the same keys
# without Hyper (e.g. mod-y Ctrl+e == hyper-Ctrl-e). The mode exits after one
# binding, on Escape/Return, or after $mode_timeout_secs.
#
# The mode body is generated by bin/sway-hyper-mode-gen from all top-level
# `bindsym $hyper+...` lines — nothing to maintain here. Sway reads includes
# before exec_always runs, so the script reloads sway once if the generated
# file changed (guarded against loops, see the script header). A missing file
# (first start) is silently skipped by include.
set $mode_hyper hyper
bindsym $mod+y mode "$mode_hyper"; exec sway-mode-timeout $mode_timeout_secs
include ~/.cache/sway/hyper-mode.conf
exec_always sway-hyper-mode-gen --reload
# }}} = Hyper Mode (ANSI fallback) ============================================
